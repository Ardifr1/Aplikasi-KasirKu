<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir (POS) - Kasir App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="dashboard.html">Dashboard</a><a href="pos.html">Kasir</a><a href="products.html">Produk</a><a href="transactions.html">Transaksi</a><a href="#" id="logout">Logout</a>
  </nav>
  <div class="container">
    <h1>Kasir</h1>
    <!-- TODO: bangun UI keranjang + scan barcode sesuai Figma -->
    <input id="barcode" placeholder="Scan / ketik barcode lalu Enter">
    <div id="cart"></div>
    <form id="pay">
      <label>Diskon <input id="discount" type="number" value="0" min="0"></label>
      <label>Pajak <input id="tax" type="number" value="0" min="0"></label>
      <label>Metode <select id="method"><option value="cash">cash</option><option value="qris">qris</option><option value="transfer">transfer</option><option value="debit">debit</option><option value="credit">credit</option><option value="ewallet">ewallet</option></select></label>
      <label>Nominal <input id="amount" type="number" min="1"></label>
      <label>Referensi <input id="reference" placeholder="opsional (qris/transfer)"></label>
      <button>Bayar (POST /api/transactions)</button>
    </form>
    <div id="result"></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pos.js"></script>
</body>
</html>
